    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="entete">
        <a class="logo" href="booster.html">Runedex</a>
        <ul class="menu">
            <li><a class="menuItem" href="booster.html" aria-current="page">Booster</a></li>
            <li><a class="menuItem" href="collection.php">Collection</a></li>
            <li><a class="menuItem" href="echanges.php">Échanges</a></li>
            <li><a class="menuItem" href="expeditions.php">Expéditions</a></li>
            <li><a class="menuItem" href="duels.php">Duels</a></li>
            <li><a class="menuItem" href="objets.html">Objets</a></li>
            <li><a class="menuItem" href="defis.php">Défis</a></li>
            <li><a class="menuItem" href="joueurs.php">Joueurs</a></li>
            <li><a class="menuItem" href="api.html">Rechercher un champion</a></li>
            <li><a class="menuItem" href="compte.php">Compte</a></li>
        </ul>
        <button class="ChangementDeMode">Mode clair</button>
        <button class="hamburger" aria-label="Menu">
            <i class="menuIcon material-icons">menu</i>
            <i class="closeIcon material-icons">close</i>
        </button>
    </header>
    <main class="page-booster">
        <h1>Choisis ton booster</h1>
        <div class="quotidien panneau" id="quotidien" hidden>
            <i class="material-icons rubis-icone" aria-hidden="true">redeem</i>
            <p id="texteQuotidien" aria-live="polite"></p>
            <button class="bouton bouton-or" id="boutonQuotidien">Récupérer</button>
        </div>
        <div class="choix">
            <div class="grille-paquets" id="paquets" aria-label="Boosters"></div>
            <aside class="panneau panneau-booster">
                <h2 id="nomPaquet">…</h2>
                <p class="sous-titre" id="sousTitre"></p>
                <div class="infos">
                    <p class="info"><strong>5</strong><span>cartes par booster</span></p>
                    <p class="info"><strong id="stock">–</strong><span id="stockLabel">boosters en stock, +1 toutes les 10 min</span></p>
                </div>
                <button class="bouton bouton-or" id="ouvrirBooster">Ouvrir</button>
                <button class="bouton bouton-secondaire" id="voirPersos">Voir les personnages de ce booster</button>
                <p id="minuteur" aria-live="polite"></p>
                <p class="info-pitie" id="pitie" hidden></p>
                <div class="achat-rubis">
                    <p class="solde-rubis"><i class="material-icons rubis-icone" aria-hidden="true">diamond</i><strong id="rubis">–</strong> rubis</p>
                    <button class="bouton bouton-secondaire" id="acheterBooster">Acheter un booster · 180 rubis</button>
                    <p class="info-achat" id="infoAchat" aria-live="polite"></p>
                </div>
            </aside>
        </div>
    </main>
    <dialog class="fiche-modale" id="modalePersos" aria-labelledby="titrePersos">
        <button class="fermer fermer-modale" id="fermerPersos" aria-label="Fermer"><i class="material-icons">close</i></button>
        <div class="skins-contenu">
            <h2 id="titrePersos">Personnages</h2>
            <p class="info-skins" id="infoPersos"></p>
            <div class="grille-skins grille-persos" id="listePersos"></div>
        </div>
    </dialog>
    <!-- Fiche d'un champion, ouverte par-dessus la liste (fonction ouvrirFiche dans paquets.js) -->
    <dialog class="fiche-modale" id="ficheModale" aria-labelledby="ficheTitre">
        <button class="fermer fermer-modale" id="fermerFiche" aria-label="Fermer la fiche"><i class="material-icons">close</i></button>
        <div class="fiche-contenu" id="ficheContenu"></div>
    </dialog>
    <script src="paquets.js"></script>
    <script src="booster.js"></script>
    <script src="main.js"></script>
</body>
</html>
