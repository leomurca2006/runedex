<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 154 280">
  <!-- Dos des cartes « Runedex » : formes uniquement (pas de texte, une image de fond ne charge pas les polices) -->
  <defs>
    <radialGradient id="fond" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#4a2823"/>
      <stop offset=".55" stop-color="#23141a"/>
      <stop offset="1" stop-color="#0f0a0c"/>
    </radialGradient>
    <radialGradient id="lueur" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4c84a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f4c84a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset=".5" stop-color="#f4c84a"/>
      <stop offset="1" stop-color="#b8852a"/>
    </linearGradient>
    <pattern id="losanges" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="none" stroke="#f4c84a" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="154" height="280" fill="url(#fond)"/>
  <rect width="154" height="280" fill="url(#losanges)"/>
  <!-- double cadre doré -->
  <rect x="8" y="8" width="138" height="264" rx="6" fill="none" stroke="url(#or)" stroke-width="1.5"/>
  <rect x="13" y="13" width="128" height="254" rx="3" fill="none" stroke="#f4c84a" stroke-opacity=".35" stroke-width=".75"/>
  <g fill="url(#or)"><path d="M12 8 L16 12 L12 16 L8 12Z"/><path d="M142 8 L146 12 L142 16 L138 12Z"/><path d="M12 264 L16 268 L12 272 L8 268Z"/><path d="M142 264 L146 268 L142 272 L138 268Z"/><path d="M30 30 H68 M86 30 H124" stroke="#f4c84a" stroke-opacity=".8" stroke-width=".8" fill="none"/><path d="M77 26 L81 30 L77 34 L73 30Z"/><path d="M64 28.4 L65.6 30 L64 31.6 L62.4 30Z"/><path d="M90 28.4 L91.6 30 L90 31.6 L88.4 30Z"/><path d="M30 250 H68 M86 250 H124" stroke="#f4c84a" stroke-opacity=".8" stroke-width=".8" fill="none"/><path d="M77 246 L81 250 L77 254 L73 250Z"/><path d="M64 248.4 L65.6 250 L64 251.6 L62.4 250Z"/><path d="M90 248.4 L91.6 250 L90 251.6 L88.4 250Z"/></g>
  <!-- rayons verticaux vers les frises -->
  <path d="M77 38 V92 M77 188 V242" stroke="#f4c84a" stroke-opacity=".3" stroke-width=".75"/>
  <!-- médaillon central -->
  <circle cx="77" cy="140" r="60" fill="url(#lueur)"/>
  <circle cx="77" cy="140" r="40" fill="#1a0f12" stroke="url(#or)" stroke-width="2"/>
  <circle cx="77" cy="140" r="34" fill="none" stroke="#f4c84a" stroke-opacity=".45" stroke-width=".75" stroke-dasharray="2 3"/>
  <polygon points="77.00,112.00 81.21,129.84 96.80,120.20 87.16,135.79 105.00,140.00 87.16,144.21 96.80,159.80 81.21,150.16 77.00,168.00 72.79,150.16 57.20,159.80 66.84,144.21 49.00,140.00 66.84,135.79 57.20,120.20 72.79,129.84" fill="url(#or)"/>
  <polygon points="83.51,124.29 81.95,135.05 92.71,133.49 84.00,140.00 92.71,146.51 81.95,144.95 83.51,155.71 77.00,147.00 70.49,155.71 72.05,144.95 61.29,146.51 70.00,140.00 61.29,133.49 72.05,135.05 70.49,124.29 77.00,133.00" fill="#1a0f12" opacity=".55"/>
